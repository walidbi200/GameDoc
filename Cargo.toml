[package]
name = "gamedoc"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
description = "Deterministic, read-only Linux gaming diagnostics"
repository = "https://github.com/walidbi200/GameDoc"
homepage = "https://github.com/walidbi200/GameDoc"
documentation = "https://docs.rs/gamedoc"
license = "MIT"
readme = "README.md"
keywords = ["gaming", "linux", "diagnostics", "system", "hardware"]
categories = ["command-line-utilities", "os", "hardware-support"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
jsonschema = "0.17"
