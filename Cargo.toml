[package]
name = "gamedoc"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Deterministic, read-only Linux gaming diagnostics"
license = "MIT"
readme = "README.md"
keywords = ["gaming", "linux", "diagnostics"]
categories = ["command-line-utilities"]
repository = "https://github.com/walidbi200/GameDoc"
homepage = "https://github.com/walidbi200/GameDoc"
documentation = "https://github.com/walidbi200/GameDoc#readme"

[dependencies]
anyhow = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
